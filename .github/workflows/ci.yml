name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit & integration tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  test-backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20 (for building embedded frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Build frontend dist
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Steel Scheme (0.8.2)
        run: |
          curl -sL https://github.com/mattwparas/steel/releases/download/v0.8.2/steel-interpreter-x86_64-unknown-linux-gnu.tar.xz | sudo tar -xJ --strip-components=1 -C /usr/local/bin steel-interpreter-x86_64-unknown-linux-gnu/steel
          sudo chmod +x /usr/local/bin/steel
          steel --version

      - name: Run cargo tests
        run: cargo test --manifest-path server/Cargo.toml -- --nocapture

      - name: Build release binary
        run: cargo build --release --manifest-path server/Cargo.toml
