name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: scheme-ide-linux-x86_64.tar.gz
          - name: macOS Universal
            os: macos-latest
            target: universal
            artifact_name: scheme-ide-macos-universal.tar.gz
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: scheme-ide-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target != 'universal' && matrix.platform.target || '' }}

      - name: Build binary (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --target ${{ matrix.platform.target }} --manifest-path server/Cargo.toml
          tar -czvf ${{ matrix.platform.artifact_name }} -C server/target/${{ matrix.platform.target }}/release scheme-ide

      - name: Build binary (macOS Universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin --manifest-path server/Cargo.toml
          cargo build --release --target x86_64-apple-darwin --manifest-path server/Cargo.toml
          mkdir -p server/target/universal
          lipo -create -output server/target/universal/scheme-ide \
            server/target/aarch64-apple-darwin/release/scheme-ide \
            server/target/x86_64-apple-darwin/release/scheme-ide
          chmod +x server/target/universal/scheme-ide
          tar -czvf ${{ matrix.platform.artifact_name }} -C server/target/universal scheme-ide

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/fetch-windows-bins.ps1 -OutDir "bin/windows"
          foreach ($f in @("coreutils.exe", "find.exe", "xargs.exe", "rg.exe", "busybox64.exe")) {
            if (-not (Test-Path "bin/windows/$f")) {
              throw "Required Windows tool bin/windows/$f was not downloaded!"
            }
          }
          cargo build --release --target ${{ matrix.platform.target }} --manifest-path server/Cargo.toml
          New-Item -ItemType Directory -Force -Path "dist_win"
          Copy-Item "server/target/${{ matrix.platform.target }}/release/scheme-ide.exe" "dist_win/scheme-ide.exe"
          Compress-Archive -Path "dist_win\*" -DestinationPath ${{ matrix.platform.artifact_name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: ${{ matrix.platform.artifact_name }}
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-artifacts
        run: |
          sha256sum scheme-ide-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/scheme-ide-linux-x86_64.tar.gz
            release-artifacts/scheme-ide-macos-universal.tar.gz
            release-artifacts/scheme-ide-windows-x86_64.zip
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
