[package]
name = "server"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3"
portable-pty = "0.9.0"
futures-util = "0.3"
anyhow = "1.0"
rust-embed = "8"
mime_guess = "2.0"
steel-interpreter = { version = "=0.8.2", default-features = false }
clap = { version = "4", features = ["derive"] }
which = "8"

[[bin]]
name = "scheme-ide"
path = "src/main.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.24"
